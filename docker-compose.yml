
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telefonbuch-backend
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - telefonbuch-network
    env_file: .env
    depends_on:
      - valkey
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: telefonbuch-valkey
    networks:
      - telefonbuch-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telefonbuch-frontend
    ports:
      - "8080:80"
    networks:
      - telefonbuch-network
    restart: unless-stopped

networks:
  telefonbuch-network:
    driver: bridge
